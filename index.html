<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LG Product Lookup</title>
<link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/2/20/LG_symbol.svg">

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#222;
  --sub:#666;
}

body.dark{
  --bg:#121212;
  --card:#1e1e1e;
  --text:#f5f5f5;
  --sub:#bbbbbb;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  background:var(--bg);
  color:var(--text);
}

.header{
  background:linear-gradient(135deg,#a50034,#d81b60);
  color:white;
  padding:18px;
  border-radius:0 0 18px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.toggle{
  background:white;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

.container{ padding:15px; }

input,select{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid #ccc;
  background:var(--card);
  color:var(--text);
}

.summary{
  display:flex;
  gap:10px;
  margin-bottom:12px;
  flex-wrap:wrap;
}

.summary-card{
  flex:1;
  background:var(--card);
  border-radius:10px;
  padding:10px;
  text-align:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

.locationDash{
  background:var(--card);
  border-radius:10px;
  padding:10px;
  margin-bottom:12px;
  box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

.product{
  background:var(--card);
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
  display:flex;
  gap:12px;
  align-items:center;
  box-shadow:0 6px 14px rgba(0,0,0,0.15);
}

.product img{
  width:90px;
  height:90px;
  object-fit:contain;
  border-radius:8px;
  cursor:pointer;
}

.details{ flex:1; }

.sku{
  font-weight:bold;
  font-size:16px;
}

.small{
  font-size:13px;
  color:var(--sub);
  margin-top:3px;
}

.no-result{
  text-align:center;
  margin-top:20px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
}

.modal img{
  max-width:95%;
  max-height:95%;
  border-radius:10px;
}

.close{
  position:absolute;
  top:20px;
  right:20px;
  color:white;
  font-size:30px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  <h2>LG Product Lookup - 25th March</h2>
  <button class="toggle" onclick="toggleDark()">🌙 Dark</button>
</div>
  
<div class="container">

<input type="text" id="search" placeholder="Enter SKU">

<select id="categoryFilter">
<option value="">All Categories</option>
<option>Washing Machine</option>
<option>TV</option>
<option>AC</option>
<option>Dish Washer</option>
<option>Water Purifier</option>
<option>Microwave Oven</option>
<option>Refrigerator</option>
<option>AV</option>
</select>

<select id="typeFilter">
<option value="">All Types</option>
</select>

<select id="ratingFilter">
<option value="">All Ratings</option>
<option value="1">⭐</option>
<option value="2">⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="5">⭐⭐⭐⭐⭐</option>
</select>

<select id="stockFilter">
<option value="">All Stock</option>
<option value="in">In Stock</option>
<option value="out">Out of Stock</option>
</select>

<select id="locationFilter">
<option value="">All Locations</option>
<option>Azamgarh</option>
<option>Bhadohi</option>
<option>Deoria</option>
<option>Ghazipur</option>
<option>Jaunpur</option>
<option>Kushinagar</option>
<option>Mau</option>
<option>Mirzapur</option>
<option>Mughalsarai</option>
<option>Prayagraj</option>
<option>Gilat Bazar</option>
<option>Medical Road</option>
<option>Kareli</option>
<option>Ravindrapuri</option>
<option>Pandeypur</option>
<option>Ramnagar</option>
<option>SUNDERPUR</option>
<option>Saulemasarai</option>
<option>LUXA</option>
</select>

<div class="summary">
  <div class="summary-card">Total Models<br><b id="totalCount">0</b></div>
  <div class="summary-card">In Stock<br><b id="inStockCount">0</b></div>
  <div class="summary-card">Out Stock<br><b id="outStockCount">0</b></div>
</div>

<div class="locationDash" id="locationDash"></div>
<div id="results"></div>

</div>

<div class="modal" id="imgModal">
  <span class="close" onclick="closeModal()">×</span>
  <img id="modalImg">
</div>

<script>

let products=[];

const LOCATIONS=[
"Azamgarh","Bhadohi","Deoria","Ghazipur","Jaunpur",
"Kushinagar","Mau","Mirzapur","Mughalsarai","Prayagraj",
"Gilat Bazar","Medical Road","Kareli","Ravindrapuri",
"Pandeypur","Ramnagar","SUNDERPUR","Saulemasarai","LUXA"
];

const typeMap={
"TV":["HD Ready","FHD","UHD","OLED","NanoCell"],
"Washing Machine":["Top Load","Front Load","Automatic","Semi-Automatic"],
"AC":["Split","Window","Inverter"],
"AV":["SoundBar","XBoom"]
};

function toggleDark(){
  document.body.classList.toggle("dark");
}

async function fetchData(){

const SHEET_ID="1y87usdTNDTIbCGwvyjaUmwReye_O9J1qEGMm_7YI_BM";
const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

const res=await fetch(url);
const text=await res.text();
const json=JSON.parse(text.substring(47,text.length-2));
const rows=json.table.rows;

products=rows.map(r=>({
sku:r.c[0]?.v||"",
category:r.c[1]?.v||"",
type:r.c[2]?.v||"",
automation:r.c[3]?.v||"",
rating:r.c[4]?.v?.toString()||"",
capacity:r.c[5]?.v||"",
description:r.c[6]?.v||"",
image:r.c[7]?.v||"",
Azamgarh:parseInt(r.c[8]?.v||0),
Bhadohi:parseInt(r.c[9]?.v||0),
Deoria:parseInt(r.c[10]?.v||0),
Ghazipur:parseInt(r.c[11]?.v||0),
Jaunpur:parseInt(r.c[12]?.v||0),
Kushinagar:parseInt(r.c[13]?.v||0),
Mau:parseInt(r.c[14]?.v||0),
Mirzapur:parseInt(r.c[15]?.v||0),
Mughalsarai:parseInt(r.c[16]?.v||0),
Prayagraj:parseInt(r.c[17]?.v||0),
"Gilat Bazar":parseInt(r.c[18]?.v||0),
"Medical Road":parseInt(r.c[19]?.v||0),
Kareli:parseInt(r.c[20]?.v||0),
Ravindrapuri:parseInt(r.c[21]?.v||0),
Pandeypur:parseInt(r.c[22]?.v||0),
Ramnagar:parseInt(r.c[23]?.v||0),
SUNDERPUR:parseInt(r.c[24]?.v||0),
Saulemasarai:parseInt(r.c[25]?.v||0),
LUXA:parseInt(r.c[26]?.v||0)
}));

updateTypeOptions();
filterProducts();
}

function totalStock(p){
return LOCATIONS.reduce((sum,loc)=>sum+p[loc],0);
}

function updateTypeOptions(){
typeFilter.innerHTML="<option value=''>All Types</option>";
if(typeMap[categoryFilter.value]){
typeMap[categoryFilter.value].forEach(t=>{
let opt=document.createElement("option");
opt.value=t;
opt.textContent=t;
typeFilter.appendChild(opt);
});
}
}

function filterProducts(){

let query=search.value.toUpperCase();
let category=categoryFilter.value;
let type=typeFilter.value;
let rating=ratingFilter.value;
let stockF=stockFilter.value;
let location=locationFilter.value;

let filtered=products.filter(p=>{
let matchSearch=p.sku.toUpperCase().includes(query);
let matchCat=!category||p.category===category;
let matchType=!type||p.type===type||p.automation===type;
let matchRating=!rating||p.rating===rating;
let matchLocation=!location||p[location]>0;

let matchStock=true;
if(stockF==="in") matchStock=location?p[location]>0:totalStock(p)>0;
if(stockF==="out") matchStock=location?p[location]===0:totalStock(p)===0;

return matchSearch&&matchCat&&matchType&&matchRating&&matchLocation&&matchStock;
});

totalCount.innerText=filtered.length;
inStockCount.innerText=filtered.filter(p=>location?p[location]>0:totalStock(p)>0).length;
outStockCount.innerText=filtered.filter(p=>location?p[location]===0:totalStock(p)===0).length;

let dashHTML="<b>Stock by Location</b><br>";

if(location){
let totalLoc=filtered.reduce((sum,p)=>sum+p[location],0);
if(totalLoc>0) dashHTML+=`${location}: ${totalLoc} units`;
}else{
LOCATIONS.forEach(loc=>{
let totalLoc=filtered.reduce((sum,p)=>sum+p[loc],0);
if(totalLoc>0) dashHTML+=`${loc}: ${totalLoc} units<br>`;
});
}
locationDash.innerHTML=dashHTML;

results.innerHTML="";
if(filtered.length===0){
results.innerHTML="<div class='no-result'>No match found</div>";
return;
}

filtered.forEach(p=>{

let activeLocations=LOCATIONS
.filter(loc=>p[loc]>0)
.map(loc=>`${loc}: ${p[loc]}`);

let locText=location
? `${location}: ${p[location]}`
: activeLocations.join(" | ");

let stars="⭐".repeat(parseInt(p.rating||0));

results.innerHTML+=`
<div class="product">
${p.image?`<img src="${p.image}" onclick="openModal('${p.image}')">`:""}
<div class="details">
<div class="sku">${p.sku}</div>
<div class="small">${p.category} • ${p.type} • ${p.automation} • ${stars}</div>
<div class="small">${p.capacity}</div>
<div class="small">${p.description}</div>
<div class="small">${locText}</div>
<div class="small"><b>Total: ${totalStock(p)}</b></div>
</div>
</div>
`;

});

}

function openModal(src){
modalImg.src=src;
imgModal.style.display="flex";
}

function closeModal(){
imgModal.style.display="none";
}

document.querySelectorAll("input,select").forEach(el=>{
el.addEventListener("input",filterProducts);
el.addEventListener("change",filterProducts);
});

categoryFilter.addEventListener("change",updateTypeOptions);

fetchData();

</script>
</body>
</html>
