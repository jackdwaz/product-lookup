<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LG Model Price List</title>

<style>

body{
font-family:Arial;
margin:0;
padding:15px;
background:#f5f5f5;
}

.header{
text-align:center;
margin-bottom:20px;
}

.header img{
width:250px;
margin-bottom:10px;
}

.search{
margin-bottom:15px;
}

input{
width:100%;
padding:10px;
font-size:16px;
border-radius:6px;
border:1px solid #ccc;
}

.filters{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-bottom:20px;
}

.filters button{
padding:6px 10px;
border:none;
background:#e0e0e0;
border-radius:4px;
cursor:pointer;
font-size:13px;
}

.filters button:hover{
background:#c62828;
color:white;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:15px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.model{
font-weight:bold;
font-size:16px;
}

.category{
font-size:12px;
color:#777;
margin-bottom:6px;
}

.price{
font-size:14px;
}

.dp{
color:#d32f2f;
font-weight:bold;
}

.desc{
font-size:13px;
margin-top:6px;
color:#444;
}

</style>
</head>

<body>

<div class="header">

<img src="https://drive.google.com/uc?export=view&id=1o4Qscq-Vo2CsQNnn7eJLclze50bz2M9A">

<h2>LG Model Price List</h2>

</div>

<div class="search">
<input type="text" id="searchInput" placeholder="Search Model...">
</div>

<div class="filters">

<button onclick="setCategory('ALL')">ALL</button>
<button onclick="setCategory('AUDIO')">AUDIO</button>
<button onclick="setCategory('DC')">DC</button>
<button onclick="setCategory('FAN & APR')">FAN & APR</button>
<button onclick="setCategory('FL-WM & DWASH')">FL-WM & DWASH</button>
<button onclick="setCategory('FPD')">FPD</button>
<button onclick="setCategory('French Door')">French Door</button>
<button onclick="setCategory('MWO')">MWO</button>
<button onclick="setCategory('RAC')">RAC</button>
<button onclick="setCategory('SA-WM')">SA-WM</button>
<button onclick="setCategory('SIDE BY SID')">SIDE BY SID</button>
<button onclick="setCategory('TF-MODELS')">TF-MODELS</button>
<button onclick="setCategory('TL-WM')">TL-WM</button>
<button onclick="setCategory('WATER Purifier')">WATER Purifier</button>

</div>

<div class="products" id="productList"></div>

<script>

let sheetID="YOUR_SHEET_ID";
let sheetName="Sheet1";

let url=`https://opensheet.elk.sh/${sheetID}/${sheetName}`;

let allData=[];
let currentCategory="ALL";

fetch(url)
.then(res=>res.json())
.then(data=>{
allData=data;
showProducts(data);
});

function showProducts(data){

let html="";

data.forEach(item=>{

html+=`

<div class="card">

<div class="model">${item.MODEL}</div>

<div class="category">${item.Category}</div>

<div class="price">MRP : ₹${item.MRP}</div>

<div class="price dp">DP : ₹${item.DP}</div>

<div class="price">GST : ${item["GST %"]}%</div>

<div class="price">CAT : ${item.CAT}</div>

<div class="desc">${item.Description}</div>

</div>

`;

});

document.getElementById("productList").innerHTML=html;

}

function setCategory(cat){

currentCategory=cat;
applyFilters();

}

document.getElementById("searchInput").addEventListener("keyup",applyFilters);

function applyFilters(){

let search=document.getElementById("searchInput").value.toLowerCase();

let filtered=allData.filter(item=>{

let categoryMatch=currentCategory==="ALL" || item.Category===currentCategory;

let searchMatch=
item.MODEL.toLowerCase().includes(search) ||
item.Description.toLowerCase().includes(search);

return categoryMatch && searchMatch;

});

showProducts(filtered);

}

</script>

</body>
</html>
