<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LG Product Lookup</title>

<link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/2/20/LG_symbol.svg">
<link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/2/20/LG_symbol.svg">

<style>

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
  margin: 0;
  background: #f4f6f8;
}

/* Header */
.header {
  background: linear-gradient(135deg, #a50034, #d81b60);
  color: white;
  padding: 18px;
  border-radius: 0 0 18px 18px;
}

.container { padding: 15px; }

/* Inputs */
input, select {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 8px;
  border: 1px solid #ddd;
}

/* Summary */
.summary {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}

.summary-card {
  flex: 1;
  background: white;
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}

.summary-card span {
  font-size: 18px;
  font-weight: bold;
}

/* Category Dashboard */
.dashboard {
  display: flex;
  overflow-x: auto;
  gap: 10px;
  margin-bottom: 12px;
}

.dash-card {
  min-width: 140px;
  background: white;
  border-radius: 10px;
  padding: 10px;
  font-size: 13px;
}

/* Product Card */
.product {
  background: white;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 12px;
  display: flex;
  gap: 12px;
  align-items: center;
}

.product img {
  width: 90px;
  height: 90px;
  object-fit: contain;
  border-radius: 8px;
  background: #fafafa;
  cursor: pointer;
}

/* Text */
.details { flex: 1; }

.sku { font-weight: bold; font-size: 16px; }

.small { font-size: 13px; color: #666; }

.description { font-size: 14px; margin-top: 4px; }

/* Stock Badge */
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
  margin-top: 6px;
}

.in { background: #e8f5e9; color: #2e7d32; }

.out { background: #ffebee; color: #c62828; }

.no-result { text-align: center; color: #777; }

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 999;
  background: rgba(0,0,0,0.9);
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.modal-content {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(1);
  max-width: 90%;
  max-height: 80%;
}

/* Spinner */
.spinner {
  border: 5px solid #f3f3f3;
  border-top: 5px solid #d81b60;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
  position: absolute;
  top: 50%;
  left: 50%;
  margin-top: -20px;
  margin-left: -20px;
}

@keyframes spin {
  0% { transform: rotate(0deg);}
  100% { transform: rotate(360deg);}
}

</style>

</head>
<body>

<div class="header">
  <h2>LG Product Lookup</h2>
</div>

<div class="container">

<input type="text" id="search" placeholder="Enter full or partial SKU">

<select id="categoryFilter">
<option value="">All Categories</option>
<option value="Washing Machine">Washing Machine</option>
<option value="TV">TV</option>
<option value="AC">AC</option>
<option value="Dish Washer">Dish Washer</option>
<option value="Water Purifier">Water Purifier</option>
<option value="Microwave Oven">Microwave Oven</option>
<option value="Refrigerator">Refrigerator</option>
<option value="AV">AV</option>
</select>

<select id="stockFilter">
<option value="">All Stock</option>
<option value="in">In Stock</option>
<option value="out">Out of Stock</option>
</select>

<!-- SUMMARY -->
<div class="summary">
  <div class="summary-card">Total<span id="totalCount">0</span></div>
  <div class="summary-card">In Stock<span id="inStockCount">0</span></div>
  <div class="summary-card">Out<span id="outStockCount">0</span></div>
</div>

<!-- CATEGORY DASHBOARD -->
<div id="dashboard" class="dashboard"></div>

<div id="results"></div>

</div>

<!-- IMAGE MODAL -->
<div id="imgModal" class="modal">
  <div class="spinner" id="spinner"></div>
  <img id="modalImg" class="modal-content">
</div>

<script>

let products = [];

async function fetchData() {

const SHEET_ID = "1y87usdTNDTIbCGwvyjaUmwReye_O9J1qEGMm_7YI_BM";
const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

const response = await fetch(url);
const text = await response.text();

const json = JSON.parse(text.substring(47, text.length - 2));
const rows = json.table.rows;

products = rows.map(r => ({
sku: r.c[0]?.v || "",
category: r.c[1]?.v || "",
type: r.c[2]?.v || "",
rating: r.c[4]?.v?.toString() || "",
capacity: r.c[5]?.v || "",
description: r.c[6]?.v || "",
image: r.c[7]?.v || "",
stock: r.c[8]?.v?.toString() || "0"
}));

filterProducts();
}

function filterProducts() {

const query = document.getElementById("search").value.toUpperCase();
const category = document.getElementById("categoryFilter").value;
const stockFilter = document.getElementById("stockFilter").value;
const resultsDiv = document.getElementById("results");

const filtered = products.filter(p => {

const matchesSearch = p.sku.toUpperCase().includes(query);
const matchesCategory = category === "" || p.category === category;

let matchesStock = true;
if (stockFilter === "in") matchesStock = parseInt(p.stock) > 0;
if (stockFilter === "out") matchesStock = parseInt(p.stock) === 0;

return matchesSearch && matchesCategory && matchesStock;

});

/* SUMMARY */

let total = filtered.length;
let inStock = filtered.filter(p => parseInt(p.stock) > 0).length;
let outStock = filtered.filter(p => parseInt(p.stock) === 0).length;

totalCount.innerText = total;
inStockCount.innerText = inStock;
outStockCount.innerText = outStock;

/* CATEGORY DASHBOARD */

let dashHTML = "";
let categories = {};

filtered.forEach(p => {
if (!categories[p.category]) {
categories[p.category] = {total:0,in:0,out:0};
}
categories[p.category].total++;
if (parseInt(p.stock)>0) categories[p.category].in++;
else categories[p.category].out++;
});

for (let cat in categories) {
let c = categories[cat];
dashHTML += `
<div class="dash-card">
<b>${cat}</b><br>
Total: ${c.total}<br>
In: ${c.in}<br>
Out: ${c.out}
</div>`;
}

document.getElementById("dashboard").innerHTML = dashHTML;

/* RENDER */

resultsDiv.innerHTML = "";

if (filtered.length === 0) {
resultsDiv.innerHTML = "<div class='no-result'>No match found</div>";
return;
}

filtered.forEach(p => {

const div = document.createElement("div");
div.className = "product";

const stockStatus = parseInt(p.stock) > 0
? `<span class="badge in">In Stock (${p.stock})</span>`
: `<span class="badge out">Out of Stock</span>`;

div.innerHTML = `

${p.image ? `<img src="${p.image}" onclick="openModal('${p.image}')">` : ""}

<div class="details">
<div class="sku">${p.sku}</div>
<div class="small">${p.category} • ${p.type} • ${p.rating}★</div>
<div class="small">${p.capacity}</div>
<div class="description">${p.description}</div>
${stockStatus}
</div>
`;

resultsDiv.appendChild(div);

});

}

/* IMAGE MODAL WITH PINCH + SWIPE */

let modal = document.getElementById("imgModal");
let modalImg = document.getElementById("modalImg");
let spinner = document.getElementById("spinner");

let scale = 1;
let startY = 0;

function openModal(src) {
modal.style.display = "block";
spinner.style.display = "block";
modalImg.style.transform = "translate(-50%, -50%) scale(1)";
scale = 1;

modalImg.onload = () => spinner.style.display = "none";
modalImg.src = src;
}

modal.onclick = () => modal.style.display = "none";

/* Pinch Zoom */

modalImg.addEventListener("wheel", e => {
e.preventDefault();
scale += e.deltaY * -0.001;
scale = Math.min(Math.max(.5, scale), 4);
modalImg.style.transform =
`translate(-50%, -50%) scale(${scale})`;
});

/* Swipe Down Close */

modalImg.addEventListener("touchstart", e => {
startY = e.touches[0].clientY;
});

modalImg.addEventListener("touchmove", e => {
let moveY = e.touches[0].clientY;
if (moveY - startY > 120) {
modal.style.display = "none";
}
});

/* EVENTS */

search.addEventListener("input", filterProducts);
categoryFilter.addEventListener("change", filterProducts);
stockFilter.addEventListener("change", filterProducts);

fetchData();

</script>

</body>
</html>
