<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LG Product Lookup</title>

<link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/2/20/LG_symbol.svg">

<style>

:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#222;
  --sub:#666;
}

body.dark{
  --bg:#121212;
  --card:#1e1e1e;
  --text:#f1f1f1;
  --sub:#bdbdbd;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  background:var(--bg);
  color:var(--text);
}

/* Header */
.header{
  background:linear-gradient(135deg,#a50034,#d81b60);
  color:white;
  padding:18px;
  border-radius:0 0 18px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.toggle{
  background:white;
  border:none;
  border-radius:20px;
  padding:6px 12px;
  cursor:pointer;
  font-weight:bold;
}

/* Container */
.container{ padding:15px; }

/* Inputs */
input,select{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
  border:1px solid #ddd;
  background:var(--card);
  color:var(--text);
}

/* Summary */
.summary{
  display:flex;
  gap:10px;
  margin-bottom:12px;
}

.summary-card{
  flex:1;
  background:var(--card);
  border-radius:10px;
  padding:10px;
  text-align:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

.summary-card span{
  display:block;
  font-size:18px;
  font-weight:bold;
}

/* Product Card */
.product{
  background:var(--card);
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:0 6px 14px rgba(0,0,0,0.18);
  display:flex;
  gap:12px;
  align-items:center;
}

.product img{
  width:90px;
  height:90px;
  object-fit:contain;
  border-radius:8px;
  background:#fafafa;
  cursor:pointer;
}

.details{ flex:1; }

.sku{
  font-weight:bold;
  font-size:16px;
}

.small{
  font-size:13px;
  color:var(--sub);
}

.description{
  font-size:14px;
  margin-top:4px;
}

.badge{
  display:inline-block;
  padding:3px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  margin-top:6px;
}

.in{ background:#e8f5e9; color:#2e7d32; }
.out{ background:#ffebee; color:#c62828; }

/* Image Modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.modal img{
  max-width:95%;
  max-height:95%;
  object-fit:contain;
}

.no-result{
  text-align:center;
  margin-top:20px;
  color:var(--sub);
}

</style>
</head>

<body>

<div class="header">
  <h2>LG Product Lookup</h2>
  <button class="toggle" onclick="toggleDark()">🌙</button>
</div>

<div class="container">

<input type="text" id="search" placeholder="Enter full or partial SKU">

<select id="categoryFilter">
<option value="">All Categories</option>
<option value="Washing Machine">Washing Machine</option>
<option value="TV">TV</option>
<option value="AC">AC</option>
<option value="Dish Washer">Dish Washer</option>
<option value="Water Purifier">Water Purifier</option>
<option value="Microwave Oven">Microwave Oven</option>
<option value="Refrigerator">Refrigerator</option>
<option value="AV">AV</option>
</select>

<select id="typeFilter">
<option value="">All Types</option>
<option value="Front Load">Front Load</option>
<option value="Top Load">Top Load</option>
<option value="Automatic">Automatic</option>
<option value="Semi-Automatic">Semi-Automatic</option>
<option value="Essential">Essential</option>
<option value="XBoom">XBoom</option>
<option value="SoundBar">SoundBar</option>
</select>

<select id="ratingFilter">
<option value="">All Ratings</option>
<option value="1">⭐</option>
<option value="2">⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="5">⭐⭐⭐⭐⭐</option>
</select>

<select id="stockFilter">
<option value="">All Stock</option>
<option value="in">In Stock</option>
<option value="out">Out of Stock</option>
</select>

<!-- SUMMARY -->
<div class="summary">
  <div class="summary-card">Total<span id="totalCount">0</span></div>
  <div class="summary-card">In Stock<span id="inStockCount">0</span></div>
  <div class="summary-card">Out<span id="outStockCount">0</span></div>
</div>

<div id="results"></div>

</div>

<!-- IMAGE MODAL -->
<div class="modal" id="imgModal" onclick="closeModal()">
  <img id="modalImg">
</div>

<script>

let products=[];

/* ELEMENTS */
const search=document.getElementById("search");
const categoryFilter=document.getElementById("categoryFilter");
const typeFilter=document.getElementById("typeFilter");
const ratingFilter=document.getElementById("ratingFilter");
const stockFilter=document.getElementById("stockFilter");

const totalCount=document.getElementById("totalCount");
const inStockCount=document.getElementById("inStockCount");
const outStockCount=document.getElementById("outStockCount");
const results=document.getElementById("results");

async function fetchData(){

const SHEET_ID="1y87usdTNDTIbCGwvyjaUmwReye_O9J1qEGMm_7YI_BM";
const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

const res=await fetch(url);
const text=await res.text();

const json=JSON.parse(text.substring(47,text.length-2));
const rows=json.table.rows;

products=rows.map(r=>({
sku:r.c[0]?.v||"",
category:r.c[1]?.v||"",
type:r.c[2]?.v||"",
automation:r.c[3]?.v||"",
rating:r.c[4]?.v?.toString()||"",
capacity:r.c[5]?.v||"",
description:r.c[6]?.v||"",
image:r.c[7]?.v||"",
stock:r.c[8]?.v?.toString()||"0"
}));

filterProducts();
}

function stars(n){
return "⭐".repeat(parseInt(n)||0);
}

function filterProducts(){

const query=search.value.toUpperCase();
const category=categoryFilter.value;
const type=typeFilter.value;
const rating=ratingFilter.value;
const stockVal=stockFilter.value;

const filtered=products.filter(p=>{

const matchesSearch=p.sku.toUpperCase().includes(query);
const matchesCategory=!category||p.category===category;
const matchesType=!type||p.type===type||p.automation===type;
const matchesRating=!rating||p.rating===rating;

let matchesStock=true;
if(stockVal==="in") matchesStock=parseInt(p.stock)>0;
if(stockVal==="out") matchesStock=parseInt(p.stock)===0;

return matchesSearch&&matchesCategory&&matchesType&&matchesRating&&matchesStock;

});

/* SUMMARY */
totalCount.innerText=filtered.length;
inStockCount.innerText=filtered.filter(p=>parseInt(p.stock)>0).length;
outStockCount.innerText=filtered.filter(p=>parseInt(p.stock)===0).length;

/* RENDER */
results.innerHTML="";

if(!filtered.length){
results.innerHTML="<div class='no-result'>No match found</div>";
return;
}

filtered.forEach(p=>{

const div=document.createElement("div");
div.className="product";

const stockBadge=parseInt(p.stock)>0
? `<span class="badge in">In Stock (${p.stock})</span>`
: `<span class="badge out">Out of Stock</span>`;

div.innerHTML=`
${p.image?`<img src="${p.image}" onclick="openModal('${p.image}')">`:""}
<div class="details">
<div class="sku">${p.sku}</div>
<div class="small">${p.category} • ${p.type} • ${stars(p.rating)}</div>
<div class="small">${p.capacity}</div>
<div class="description">${p.description}</div>
${stockBadge}
</div>
`;

results.appendChild(div);

});

}

/* MODAL */
function openModal(src){
document.getElementById("modalImg").src=src;
document.getElementById("imgModal").style.display="flex";
}

function closeModal(){
document.getElementById("imgModal").style.display="none";
}

/* DARK MODE */
function toggleDark(){
document.body.classList.toggle("dark");
}

/* EVENTS */
search.addEventListener("input",filterProducts);
categoryFilter.addEventListener("change",filterProducts);
typeFilter.addEventListener("change",filterProducts);
ratingFilter.addEventListener("change",filterProducts);
stockFilter.addEventListener("change",filterProducts);

fetchData();

</script>

</body>
</html>
